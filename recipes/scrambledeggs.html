    <h2>How to Prepare</h2>
    <ol>
        <li>Whisk 3 eggs with a fork and salt them</li>
        <li>put skillet on medium heat with some butter</li>
        <li>pour the eggs and with spatula move them</li>
        <li>turn off heat before eggs become hard and it will continue cooking</li>
        <li>serve them and enjoy</li>
    </ol>
